<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <link rel="stylesheet" href = "css/style.css">
</head>
<body>

    <h1>Hangman Game</h1>

    <p id="wordDisplay"></p>

    <input type = "text" id = "letterInput" placeholder="Enter 1 letter" maxlength="1">
    <button id = "guessButton">Guess</button>
    <button id = "restartButton">Restart</button>

    <p id = "message"></p>
    <p id = "livesRemainingDisplay"></p>

    <img id="hangmanImage" alt="Hangman Image">

    <script src = "scripts/script.js"></script>
    
</body>
</html>
