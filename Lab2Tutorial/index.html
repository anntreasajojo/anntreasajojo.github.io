<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <link rel="stylesheet" href="css/style.css">


</head>

<body background="img/numbersGame.jpg">

    <header id="gameTitle">
        <h1>Number Guessing Game</h1>
        <h2 id = "gameInstructions">Guess a number between 1-99 in seven attempts!</h2>
    </header>

    <div id = "gameContent">
        <input id="guessInput">
        <br>
        <button id="guessButton">Guess</button>
        <button id ="resetButton">Reset</button>
        <p id="guessResult"></p>
    </div>

    <h4>Total Games Won: <span id = "wins">0</span> </h4>
    <h4>Total Games Lost:  <span id = "losses">0</span> </h4>

    <h4>Previous guesses: <span id="allGuesses"></span></h4>


    <script src="scripts/script.js" defer></script>
</body>

</html>
