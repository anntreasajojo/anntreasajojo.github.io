<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h1 class="text-center mb-4">Sign Up Form</h1>

            <form>
                <fieldset>
                    <legend>Sign Up</legend>
                    First Name: <input type="text"><br>
                    Last Name: <input type="text"><br>
                    Email: <input type="text"><br>
                    Phone Number:<input type="text"><br><br>
                    Zip Code: <input type="text" id="zipCodeInput"><br>

                    <p id="zipCodeMsg"></p>

                    City: <span id="cityDisplay"></span>
                    <br>
                    Latitude: <span id="latitudeDisplay"></span>
                    <br>
                    Longitude: <span id="longitudeDisplay"></span>
                    <br><br>
                    State: <select id="states">
                        <option>Select a state</option>
                    </select><br>

                    Select a County: <select id="counties">
                        <option>Select a county</option>
                    </select><br>

                    Desired Username: <input type="text" id="userNameInput"><br>
                    <span id="usernameAvailability"></span> <br>
                    <p id="usernameCheck"></p>
                    Password: <input type="password" id="passwordInput"><br>
                    <span id="passwordGuess"></span>
                    <p id="passwordCheck"></p>
                    Type Password Again: <input type="password" id="passwordAgainInput"><br>
                    <p id="passwordMatchingMsg"></p>
                    <button type="button" id="signUp">Sign up!</button>
                    <br>
                    <span id="errorMsg"></span>
                </fieldset>
            </form>
        </div>
    </div>

</body>

</html>
